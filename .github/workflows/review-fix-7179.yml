name: Temporary PR 7179 review fix

on:
  push:
    branches:
      - fix/reset-lineage-positive-marker-review

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/reset-lineage-positive-marker-review

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply review fix and regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Backend: use an explicit positive relationship marker that already
          # survives every state.db/sidebar adapter, and make the reset successor
          # its own visible lineage root despite the durable parent link.
          replace_once(
              'api/agent_sessions.py',
              """        if _is_user_visible_reset_successor(parent, row):
              row['_reset_successor'] = True
              continue
          """,
              """        if _is_user_visible_reset_successor(parent, row):
              row['relationship_type'] = 'reset_successor'
              row['_lineage_root_id'] = row['id']
              continue
          """,
          )
          replace_once(
              'api/agent_sessions.py',
              """            if is_reset_successor:
                  entry['_reset_successor'] = True
                  continue
          """,
              """            if is_reset_successor:
                  entry['relationship_type'] = 'reset_successor'
                  entry['_lineage_root_id'] = sid
                  continue
          """,
          )

          # Frontend: preserve the historical parent-linked indicator by default.
          # Only a positively classified reset successor suppresses it, so legacy
          # /branch rows created before session_source='fork' existed stay visible.
          replace_once(
              'static/sessions.js',
              """function _showsForkOrBranchIndicator(s){
            return !!(s&&s.parent_session_id&&(s.session_source==='fork'||s.relationship_type==='child_session'));
          }
          """,
              """function _isResetSuccessor(s){
            return !!(s&&s.relationship_type==='reset_successor');
          }

          function _showsForkOrBranchIndicator(s){
            return !!(s&&s.parent_session_id&&!_isResetSuccessor(s));
          }
          """,
          )
          replace_once(
              'static/sessions.js',
              """    // Reset successors retain parent_session_id as durable lineage but are
              // independent top-level conversations. Only real forks/children get the
              // fork indicator and its \"Forked from\" tooltip (#7178).
          """,
              """    // Reset successors retain parent_session_id as durable lineage but are
              // independent top-level conversations. Suppress the historical parent-linked
              // branch indicator only for a positively classified reset successor so legacy
              // /branch rows without modern fork metadata keep their provenance (#7178).
          """,
          )

          # JS behavior regression: reset is the sole parent-linked exception;
          # modern forks, legacy generic-WebUI forks, ordinary children, and
          # unknown/unmarked parent-linked rows retain their indicator.
          replace_once(
              'tests/test_session_lineage_collapse.py',
              "eval(extractFunc('_showsForkOrBranchIndicator'));\n",
              "eval(extractFunc('_isResetSuccessor'));\neval(extractFunc('_showsForkOrBranchIndicator'));\n",
          )
          replace_once(
              'tests/test_session_lineage_collapse.py',
              "  reset: _showsForkOrBranchIndicator({{session_id:'reset', parent_session_id:'parent', session_source:'messaging'}}),\n",
              "  reset: _showsForkOrBranchIndicator({{session_id:'reset', parent_session_id:'parent', session_source:'messaging', relationship_type:'reset_successor'}}),\n",
          )
          replace_once(
              'tests/test_session_lineage_collapse.py',
              "  fork: _showsForkOrBranchIndicator({{session_id:'fork', parent_session_id:'parent', session_source:'fork'}}),\n",
              "  fork: _showsForkOrBranchIndicator({{session_id:'fork', parent_session_id:'parent', session_source:'fork'}}),\n  legacyFork: _showsForkOrBranchIndicator({{session_id:'legacy-fork', parent_session_id:'parent', session_source:'webui'}}),\n",
          )
          replace_once(
              'tests/test_session_lineage_collapse.py',
              "  child: _showsForkOrBranchIndicator({{session_id:'child', parent_session_id:'parent', relationship_type:'child_session'}}),\n",
              "  child: _showsForkOrBranchIndicator({{session_id:'child', parent_session_id:'parent', relationship_type:'child_session'}}),\n  unmarkedParent: _showsForkOrBranchIndicator({{session_id:'unknown', parent_session_id:'parent', session_source:'messaging'}}),\n  topLevel: _showsForkOrBranchIndicator({{session_id:'top', session_source:'webui'}}),\n",
          )
          replace_once(
              'tests/test_session_lineage_collapse.py',
              '    assert result == {"reset": False, "fork": True, "child": True}\n',
              '    assert result == {"reset": False, "fork": True, "legacyFork": True, "child": True, "unmarkedParent": True, "topLevel": False}\n',
          )

          # State.db-only route: the positive marker and self-root must survive
          # adaptation to the public sidebar shape; child-only metadata stays absent.
          replace_once(
              'tests/test_gateway_sync.py',
              """        assert child.get('parent_session_id') == parent_sid
              for key in (
                  'relationship_type',
                  'parent_title',
          """,
              """        assert child.get('parent_session_id') == parent_sid
              assert child.get('relationship_type') == 'reset_successor'
              assert child.get('_lineage_root_id') == child_sid
              for key in (
                  'parent_title',
          """,
          )

          # JSON-enriched route and low-level projection carry the same marker.
          replace_once(
              'tests/test_session_lineage_metadata_api.py',
              """        assert child.get('parent_session_id') == parent_sid
              for key in (
                  'relationship_type',
                  'parent_title',
          """,
              """        assert child.get('parent_session_id') == parent_sid
              assert child.get('relationship_type') == 'reset_successor'
              assert child.get('_lineage_root_id') == child_sid
              for key in (
                  'parent_title',
          """,
          )
          replace_once(
              'tests/test_session_lineage_metadata_api.py',
              """    assert 'relationship_type' not in projected['projection_legacy_reset']
              assert 'relationship_type' not in projected['projection_orphan_canonical_reset']
              for sid in (
          """,
              """    for sid in ('projection_legacy_reset', 'projection_orphan_canonical_reset'):
              assert projected[sid].get('relationship_type') == 'reset_successor'
              assert projected[sid].get('_lineage_root_id') == sid
              for sid in (
          """,
          )
          replace_once(
              'tests/test_session_lineage_metadata_api.py',
              """    ):
              assert projected[sid].get('relationship_type') == 'child_session'


          def test_child_of_hidden_compression_segment_exposes_parent_lineage_root(_isolate):
          """,
              """    ):
              assert projected[sid].get('relationship_type') == 'child_session'
              assert '_lineage_root_id' not in projected[sid]


          def test_child_of_hidden_compression_segment_exposes_parent_lineage_root(_isolate):
          """,
          )

          # Document the explicit projection contract so future code does not
          # regress back to inferring reset state from missing modern fork metadata.
          replace_once(
              'docs/rfcs/canonical-session-resolution.md',
              """top-level conversation, even when Hermes Agent retains `parent_session_id` as
          durable reset lineage. Sidebar projection must preserve that identifier without
          emitting child-session metadata for a reset successor. Compression
          """,
              """top-level conversation, even when Hermes Agent retains `parent_session_id` as
          durable reset lineage. Sidebar projection must preserve that identifier and mark
          the exception explicitly as `relationship_type='reset_successor'` without
          emitting child-session metadata for a reset successor. Compression
          """,
          )
          PY

      - name: Install targeted test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyyaml>=6.0" pytest pytest-timeout pytest-asyncio ruff

      - name: Syntax and diff checks
        run: |
          python -m compileall -q api tests
          node --check static/sessions.js
          git diff --check
          python scripts/ruff_lint.py --diff origin/master

      - name: Run reset-lineage regression suite
        run: |
          pytest -q --timeout=60 \
            tests/test_gateway_sync.py \
            tests/test_session_lineage_metadata_api.py \
            tests/test_session_lineage_report.py \
            tests/test_session_lineage_collapse.py

      - name: Commit validated patch and remove temporary workflow
        run: |
          rm .github/workflows/review-fix-7179.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/agent_sessions.py static/sessions.js \
            tests/test_gateway_sync.py tests/test_session_lineage_metadata_api.py \
            tests/test_session_lineage_collapse.py docs/rfcs/canonical-session-resolution.md \
            .github/workflows/review-fix-7179.yml
          git commit -m "fix(sessions): preserve legacy branch provenance"
          git push origin HEAD:fix/reset-lineage-positive-marker-review
