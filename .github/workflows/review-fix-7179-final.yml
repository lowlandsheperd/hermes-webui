name: Temporary PR 7179 final gate fix

on:
  push:
    branches:
      - fix/reset-lineage-final-gate-review

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/reset-lineage-final-gate-review

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply final gate fixes and regression coverage
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:160]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'api/agent_sessions.py',
              "    'resume_pending_expired',\n})\n",
              "    'resume_pending_expired',\n    'session_switch',\n})\n",
          )

          replace_once(
              'static/sessions.js',
              "    if(key===sid||row.parent_session_id===sid||row._lineage_root_id===sid||row.lineage_root_id===sid||_sessionLineageContainsSession(row,sid)){\n",
              "    if(key===sid||(!_isResetSuccessor(row)&&row.parent_session_id===sid)||row._lineage_root_id===sid||row.lineage_root_id===sid||_sessionLineageContainsSession(row,sid)){\n",
          )

          replace_once(
              'tests/test_gateway_sync.py',
              "import urllib.request\n\nREPO_ROOT = pathlib.Path(__file__).parent.parent.resolve()\n",
              "import urllib.request\n\nimport pytest\n\nREPO_ROOT = pathlib.Path(__file__).parent.parent.resolve()\n",
          )

          replace_once(
              'tests/test_session_lineage_collapse.py',
              "eval(extractFunc('_sessionTimestampMs'));\neval(extractFunc('_isChildSession'));\neval(extractFunc('_sessionLineageKey'));\neval(extractFunc('_sessionLineageContainsSession'));\neval(extractFunc('_sidebarLineageKeyForRow'));\neval(extractFunc('_collapseSessionLineageForSidebar'));\neval(extractFunc('_resolveSessionIdFromSidebarLineage'));\n",
              "eval(extractFunc('_sessionTimestampMs'));\neval(extractFunc('_isChildSession'));\neval(extractFunc('_isResetSuccessor'));\neval(extractFunc('_sessionLineageKey'));\neval(extractFunc('_sessionLineageContainsSession'));\neval(extractFunc('_sidebarLineageKeyForRow'));\neval(extractFunc('_collapseSessionLineageForSidebar'));\neval(extractFunc('_resolveSessionIdFromSidebarLineage'));\n",
          )

          anchor = "\n\ndef test_sidebar_attaches_child_sessions_to_collapsed_hidden_parent_lineage():\n"
          new_test = base64.b64decode('').decode('utf-8')
          replace_once(
              'tests/test_session_lineage_collapse.py',
              anchor,
              new_test + anchor,
          )

          replace_once(
              'tests/test_session_lineage_metadata_api.py',
              "    base_child = {\n        'source': 'wecom',\n        'parent_session_id': parent['id'],\n        'session_key': 'same-messaging-identity',\n        'actual_message_count': 2,\n        'started_at': 2,\n    }\n    rows = [\n        parent,\n        {**base_child, 'id': 'projection_legacy_reset'},\n",
              "    switch_parent = {\n        **parent,\n        'id': 'projection_switch_parent',\n        'end_reason': 'session_switch',\n    }\n    base_child = {\n        'source': 'wecom',\n        'parent_session_id': parent['id'],\n        'session_key': 'same-messaging-identity',\n        'actual_message_count': 2,\n        'started_at': 2,\n    }\n    switch_child = {\n        **base_child,\n        'id': 'projection_session_switch_reset',\n        'parent_session_id': switch_parent['id'],\n    }\n    rows = [\n        parent,\n        switch_parent,\n        {**base_child, 'id': 'projection_legacy_reset'},\n        switch_child,\n",
          )
          replace_once(
              'tests/test_session_lineage_metadata_api.py',
              "    for sid in ('projection_legacy_reset', 'projection_orphan_canonical_reset'):\n        assert projected[sid].get('relationship_type') == 'reset_successor'\n        assert projected[sid].get('_lineage_root_id') == sid\n",
              "    for sid in (\n        'projection_legacy_reset',\n        'projection_session_switch_reset',\n        'projection_orphan_canonical_reset',\n    ):\n        assert projected[sid].get('relationship_type') == 'reset_successor'\n        assert projected[sid].get('_lineage_root_id') == sid\n        for key in (\n            'parent_title',\n            'parent_source',\n            '_parent_lineage_root_id',\n            '_parent_lineage_tip_id',\n        ):\n            assert key not in projected[sid]\n",
          )

          replace_once(
              'tests/test_gateway_sync.py',
              "def test_sessions_route_keeps_reset_successor_top_level(cleanup_test_sessions):\n",
              "@pytest.mark.parametrize(\n    ('end_reason', 'canonical_marker'),\n    [('session_reset', True), ('session_switch', False)],\n)\ndef test_sessions_route_keeps_reset_successor_top_level(\n    cleanup_test_sessions, end_reason, canonical_marker\n):\n",
          )
          replace_once(
              'tests/test_gateway_sync.py',
              "    parent_sid = 'reset_lineage_parent_7178'\n    child_sid = 'reset_lineage_child_7178'\n",
              "    parent_sid = f'reset_lineage_parent_7178_{end_reason}'\n    child_sid = f'reset_lineage_child_7178_{end_reason}'\n",
          )
          replace_once(
              'tests/test_gateway_sync.py',
              "            end_reason='session_reset',\n",
              "            end_reason=end_reason,\n",
          )
          replace_once(
              'tests/test_gateway_sync.py',
              "            model_config={'_reset_from': parent_sid},\n",
              "            model_config=({'_reset_from': parent_sid} if canonical_marker else None),\n",
          )
          PY

      - name: Install targeted test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyyaml>=6.0" pytest pytest-timeout pytest-asyncio ruff

      - name: Syntax and diff checks
        run: |
          python -m compileall -q api tests
          node --check static/sessions.js
          git diff --check
          python scripts/ruff_lint.py --diff origin/master

      - name: Run reset-lineage regression suite
        run: |
          pytest -q --timeout=60 \
            tests/test_gateway_sync.py \
            tests/test_session_lineage_metadata_api.py \
            tests/test_session_lineage_report.py \
            tests/test_session_lineage_collapse.py

      - name: Commit validated patch and remove temporary workflow
        run: |
          rm .github/workflows/review-fix-7179-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/agent_sessions.py static/sessions.js \
            tests/test_gateway_sync.py tests/test_session_lineage_metadata_api.py \
            tests/test_session_lineage_collapse.py \
            .github/workflows/review-fix-7179-final.yml
          git commit -m "fix(sessions): preserve reset navigation semantics"
          git push origin HEAD:fix/reset-lineage-final-gate-review
